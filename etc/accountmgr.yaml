Name: accountmgr.rpc
ListenOn: 0.0.0.0:8080
Timeout: 10000
# 关闭服务端熔断(其它中间件保持默认开启)
Middlewares:
  Breaker: false
Etcd:
  Hosts:
    - etcd:2379 # 本地docker开发环境
    # - etcd-0.etcd.pay-ns.svc.cluster.local:2379
    # - etcd-1.etcd.pay-ns.svc.cluster.local:2379
    # - etcd-2.etcd.pay-ns.svc.cluster.local:2379
  Key: accountmgr.rpc

MasterDBConfig:
  # DataSource: root:root123456@tcp(mysql-primary.pay-ns.svc.cluster.local:3306)/account_db?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s # K8S
  DataSource: root:root123456@tcp(mysql8:3306)/account_db?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s # 本地开发环境

SlaveDBConfig:
  # DataSource: starslipay:payClipayA2026@tcp(mysql-slave.pay-ns.svc.cluster.local:3306)/account_db?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s #K8S
  DataSource: root:root123456@tcp(mysql8:3306)/account_db?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s # 本地开发环境

# Kafka 生产者配置
KafkaProducerConf:
  - kafka:29092
TopicC2cAsyncTransfer: topic_c2c_async_transfer
TopicC2bAsyncTransfer: topic_c2b_async_transfer

# Prometheus 指标采集：go-zero 会另起一个独立 HTTP 端口暴露 /metrics
Prometheus:
  Host: 0.0.0.0
  Port: 9090
  Path: /metrics