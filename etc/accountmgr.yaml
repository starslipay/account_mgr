Name: accountmgr.rpc
ListenOn: 0.0.0.0:8080
Timeout: 10000
# 关闭服务端熔断(其它中间件保持默认开启)
Middlewares:
  Breaker: false
Etcd:
  Hosts:
    - etcd:2379 # docker环境
  Key: accountmgr.rpc

MasterDBConfig:
  DataSource: root:root123456@tcp(mysql8:3306)/account_db?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s # docker环境
  # 连接池配置(不填则用默认值 64/64/60)
  MaxOpenConns: 64        # 最大打开连接数
  MaxIdleConns: 64        # 最大空闲连接数
  ConnMaxLifetimeSec: 60  # 连接最大存活时间(秒)

SlaveDBConfig:
  DataSource: root:root123456@tcp(mysql8:3306)/account_db?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s # docker环境
  # 连接池配置(从库读多,可按需调大)
  MaxOpenConns: 100       # 最大打开连接数
  MaxIdleConns: 50        # 最大空闲连接数
  ConnMaxLifetimeSec: 60  # 连接最大存活时间(秒)

# Kafka 生产者配置
KafkaProducerConf:
  - kafka:29092
TopicC2cAsyncTransfer: topic_c2c_async_transfer
TopicC2bAsyncTransfer: topic_c2b_async_transfer

# Prometheus 指标采集：go-zero 会另起一个独立 HTTP 端口暴露 /metrics
Prometheus:
  Host: 0.0.0.0
  Port: 9090
  Path: /metrics